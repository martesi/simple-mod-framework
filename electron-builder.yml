appId: com.atampy26.simple-mod-framework.mod-manager
productName: Mod Manager
directories:
  output: dist
  buildResources: buildResources
# Matches the old Mod Manager's own electron-builder.yml: safe to exclude
# everything but out/**/* (no node_modules carried into app.asar) because
# main/preload are fully bundled and, as of LEI-132, src/deploy.ts's worker
# pool is the hand-rolled node:worker_threads WorkerPool (src/workerPool.ts)
# rather than Piscina - there's no package with its own on-disk-relative
# worker-bootstrap resolution left that would need node_modules physically
# present at runtime (see electron.vite.config.ts's doc comment).
#
# One exception as of LEI-139: esbuild can't be bundled into out/main at all
# (see electron.vite.config.ts's `external` comment) - it's shipped
# separately below via extraResources instead, not through this `files` list.
files:
  - '!**/*'
  - 'out/**/*'
# The rpkg-cli/ResourceTool.exe/etc. binaries plus the hitman-hashes data
# fetch-hashes.js downloads, and cleanMicrosoftThumbs.dat (see gameDetect.ts's
# Microsoft Store thumbs.dat fallback) - mirroring the old Mod Manager's own
# extraResources setup (LEI-131). extraResources always lands outside
# app.asar, at process.resourcesPath - see paths.ts's resolveAppPaths() - no
# asarUnpack needed. Multiple entries with the same `to: Third-Party` are
# fine - electron-builder just merges their contents into that one
# destination folder.
#
# Deliberately NOT build/Third-Party/ or build/cleanMicrosoftThumbs.dat as a
# whole (see scripts/link-third-party.js) - both are populated almost
# entirely by relative symlinks into the two "For Build/" folders below (on
# purpose, so the CLI's build/ working directory doesn't duplicate ~300MB of
# binaries on every `npm run setup`), and electron-builder's extraResources
# copy doesn't dereference symlinks: it recreates the same relative-target
# symlink at the destination instead of copying real bytes, which ships a
# packaged app full of dangling links (there's no "For Build/" folder next to
# the installed app on an end user's machine). Pointing straight at the
# original folders instead sidesteps that - neither is ever a symlink itself.
#
# hash_list.txt is the one exception: fetch-hashes.js downloads it straight
# into build/Third-Party (not from either "For Build/" folder), so it's
# already a real file there with nothing to dereference - safe to reference
# directly without staging it anywhere first.
extraResources:
  - from: For Build/Third-Party
    to: Third-Party
  - from: For Build/Fetched Third-Party
    to: Third-Party
  - from: build/Third-Party/hash_list.txt
    to: Third-Party/hash_list.txt
  - from: For Build/cleanMicrosoftThumbs.dat
    to: cleanMicrosoftThumbs.dat
  - from: For Build/cleanPackageDefinition.txt
    to: cleanPackageDefinition.txt
  - from: For Build/cleanThumbs.dat
    to: cleanThumbs.dat
  # esbuild (LEI-139 - native, not esbuild-wasm, see src/typescript.ts's doc
  # comment for why) refuses to run if bundled and spawns a subprocess
  # pointed at a real on-disk binary (@esbuild/win32-x64's esbuild.exe) - it
  # can't live inside app.asar. Landing both packages at
  # resources/node_modules/esbuild and resources/node_modules/@esbuild
  # (siblings of app.asar, not inside it) means out/main/index.cjs's plain
  # `require("esbuild")` (kept external - see electron.vite.config.ts) still
  # resolves at runtime, and esbuild's own lib/main.js can in turn resolve
  # its platform binary via a normal node_modules lookup for
  # "@esbuild/win32-x64": Electron's asar-aware fs makes app.asar behave like
  # a normal folder for Node's module resolution, so the usual upward
  # node_modules search (app.asar/out/main/node_modules,
  # app.asar/out/node_modules, app.asar/node_modules, then here) finds both
  # one level above the archive root. Windows-only deliberately - this is a
  # win-only app (see the `win:` section below), so there's no other
  # @esbuild/<platform> package to ship.
  - from: node_modules/esbuild
    to: node_modules/esbuild
  - from: node_modules/@esbuild/win32-x64
    to: node_modules/@esbuild/win32-x64
protocols:
  - name: Simple Mod Framework
    schemes:
      - simple-mod-framework
win:
  executableName: Mod Manager
