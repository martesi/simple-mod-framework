name: Build

# Windows-only app (see electron-builder.yml's win-only signAndEditExecutable
# comment) whose postinstall (scripts/setup.ts -> fetch-third-party.ts)
# extracts Windows-only tooling (7z.exe, quickentity-rs.exe, etc.) via a
# Windows exe (7zr.exe) - so this always has to run on windows-latest, not
# just build the win target from another OS.
on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # scripts/setup.ts's postinstall step and package.json's own scripts invoke
      # Bun directly, so the Bun toolchain is the only runtime needed in CI.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build installer
        run: bun run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-manager-installer
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: mod-manager-installer
          path: dist

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
