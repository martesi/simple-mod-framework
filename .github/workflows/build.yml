name: Build

# Windows-only app (see electron-builder.yml's win-only signAndEditExecutable
# comment) whose postinstall (scripts/setup.js -> fetch-third-party.js)
# extracts Windows-only tooling (7z.exe, quickentity-rs.exe, etc.) via a
# Windows exe (7zr.exe) - so this always has to run on windows-latest, not
# just build the win target from another OS.
on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # scripts/setup.js's postinstall step, and package.json's own scripts
      # (e.g. "build" shelling out to "npm run typecheck"), invoke `node`/`npm`
      # directly, so both need to be on PATH even though bun.lock is what's
      # actually used to install dependencies below.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build installer
        run: bun run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-manager-installer
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: mod-manager-installer
          path: dist

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
